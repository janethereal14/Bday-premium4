<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Golden Celebration </title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&family=Playfair+Display:ital,wght@0,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --premium-white: #f4f4f4;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-bg);
            color: var(--premium-white);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; height: 100%;
        }

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            z-index: -2;
        }

        .page {
            display: none; height: 100vh; width: 100vw;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        .active { display: flex; animation: pageFade 2s forwards; }
        @keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }

        h1, h2 { font-family: 'Cinzel', serif; letter-spacing: 5px; text-transform: uppercase; margin: 10px 0; }
        p { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-style: italic; }

        .gold-btn {
            padding: 18px 45px; background: transparent; color: var(--gold);
            border: 1px solid var(--gold); border-radius: 40px;
            cursor: pointer; transition: all 0.5s ease;
            text-transform: uppercase; letter-spacing: 3px; font-size: 0.8rem;
        }

        .gold-btn:hover {
            background: var(--gold); color: black;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* Page 2: Scrolling */
        #timer { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.1rem; margin-bottom: 20px; }
        
        #scroll-content {
            height: 50vh; width: 80%; overflow: hidden;
            mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
        }

        .para {
            opacity: 0; margin: 180px 0; line-height: 2;
            transition: opacity 3s ease; white-space: nowrap;
        }

        /* Luxury Falling Elements */
        .emoji {
            position: fixed; top: -50px; pointer-events: none;
            animation: fall linear infinite; filter: drop-shadow(0 0 5px gold);
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        /* Page 3: Cake */
        .cake-box { position: relative; margin: 40px; }
        .candle { width: 8px; height: 50px; background: linear-gradient(var(--gold), #fff); margin: 0 auto; position: relative; }
        .flame {
            width: 15px; height: 25px; background: #ffae00; border-radius: 50% 50% 20% 20%;
            position: absolute; top: -25px; left: -4px; box-shadow: 0 0 20px #ffae00;
            animation: flicker 0.1s infinite alternate;
        }

        /* Page 4: Gift Grid (2-2-1 Layout) */
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 120px);
            gap: 20px;
            justify-content: center;
        }

        .gift-box {
            width: 120px; height: 120px; background: var(--glass);
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.4s; font-family: 'Cinzel'; font-size: 1.5rem;
        }

        .gift-box:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); transform: translateY(-5px); }

        .video-gift {
            grid-column: span 2;
            width: 120px;
            justify-self: center;
        }

        #media-vault {
            margin-top: 30px;
            width: 90%; max-width: 500px; height: 300px;
            display: flex; align-items: center; justify-content: center;
        }

        .media-content {
            max-width: 100%; max-height: 100%;
            border: 1px solid var(--gold);
            animation: pageFade 1s forwards;
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <audio id="bgMusic" loop src="assets/premium-ambience.mp3"></audio>

    <section id="page1" class="page active">
        <h1 style="font-size: 3.5rem;">August 14</h1>
        <p>A Journey Through Time</p>
        <button class="gold-btn" onclick="start()">Enter Experience</button>
    </section>

    <section id="page2" class="page">
        <div id="timer">Loading...</div>
        <div id="scroll-content">
            <div id="wrapper">
                <p class="para" id="p1">Sixteen years of grace and wonder.</p>
                <p class="para" id="p2">A path illuminated by your brilliant spirit.</p>
                <p class="para" id="p3">Every moment has led to this golden day.</p>
                <p class="para" id="p4">You are a masterpiece in progress.</p>
            </div>
        </div>
        <button id="wishBtn" class="gold-btn" style="opacity:0;" onclick="showCake()">Wish Now</button>
    </section>

    <section id="page3" class="page">
        <h2 id="count" style="font-size: 4rem;">3</h2>
        <div class="cake-box">
            <div class="candle"><div class="flame" id="flame"></div></div>
            <div style="width: 160px; height: 80px; background: var(--glass); border: 1px solid var(--gold);"></div>
        </div>
        <p>Close your eyes and make a wish.</p>
    </section>

    <section id="page4" class="page">
        <h2>The Collection</h2>
        <div class="gift-grid">
            <div class="gift-box" onclick="openGift(1)">I</div>
            <div class="gift-box" onclick="openGift(2)">II</div>
            <div class="gift-box" onclick="openGift(3)">III</div>
            <div class="gift-box" onclick="openGift(4)">IV</div>
            <div class="gift-box video-gift" onclick="openGift(5)">V</div>
        </div>
        
        <div id="media-vault"></div>
        <h2 id="final-tag" style="display:none; color: var(--gold); margin-top: 20px;">You are loved 💖</h2>
    </section>

    <script>
        // --- ⚙️ EDIT YOUR FILE NAMES HERE ⚙️ ---
        const giftRegistry = {
            1: "Screenshot_2026-05-04-15-30-22-145.jpeg",   // Name of your 1st photo
            2: "Screenshot_2026-05-04-15-34-31-232.jpeg", // Name of your 2nd photo
            3: "Screenshot_2026-05-04-15-51-20-647.jpeg",   // Name of your 3rd photo
            4: "Screenshot_2026-05-04-15-49-55-674.jpe", // Name of your 4th photo
            5: "VID-20260328-WA0025.mp4"   // Name of your video
        };
        const musicFile = "Saja_Boys_Ft_Andrew_Choi_neckwav_Danny_Chung_Kevin_Woo_SamUIL_KPop_Demon_Hunters_Cast_-_Soda_Pop_thinknews.com.ng.mp3"; // Name of your music file
        // ----------------------------------------

        const birthDate = new Date('August 14, 2008 00:00:00');

        function start() {
            document.getElementById('bgMusic').src = "assets/" + musicFile;
            document.getElementById('bgMusic').play();
            changePage('page2');
            initTimer();
            initEmojis();
            
            setTimeout(() => { document.getElementById('p1').style.opacity = 1; }, 3000);
            setTimeout(() => { document.getElementById('p2').style.opacity = 1; }, 7000);
            setTimeout(() => { document.getElementById('p3').style.opacity = 1; }, 11000);
            setTimeout(() => { document.getElementById('p4').style.opacity = 1; }, 15000);
            setTimeout(() => { document.getElementById('wishBtn').style.opacity = 1; }, 18000);

            let y = 0;
            const wrap = document.getElementById('wrapper');
            setInterval(() => {
                y += 0.4;
                wrap.style.transform = `translateY(-${y}px)`;
            }, 30);
        }

        function initTimer() {
            setInterval(() => {
                const diff = new Date() - birthDate;
                const days = Math.floor(diff / 86400000);
                const months = Math.floor(days / 30.44);
                const seconds = Math.floor(diff / 1000);
                document.getElementById('timer').innerText = `${months} MONTHS | ${days} DAYS | ${seconds} SECONDS`;
            }, 1000);
        }

        function initEmojis() {
            const icons = ['✨','🎉','🎊','🎂','💖'];
            setInterval(() => {
                const e = document.createElement('div');
                e.className = 'emoji';
                e.innerText = icons[Math.floor(Math.random() * icons.length)];
                e.style.left = Math.random() * 100 + 'vw';
                e.style.fontSize = (Math.random() * 20 + 15) + 'px';
                e.style.animationDuration = (Math.random() * 4 + 4) + 's';
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 8000);
            }, 400);
        }

        function showCake() {
            changePage('page3');
            let c = 3;
            const t = setInterval(() => {
                c--;
                document.getElementById('count').innerText = c;
                if(c === 0) {
                    clearInterval(t);
                    document.getElementById('flame').style.opacity = 0;
                    setTimeout(() => changePage('page4'), 1500);
                }
            }, 1000);
        }

        function openGift(n) {
            const vault = document.getElementById('media-vault');
            vault.innerHTML = ''; 
            const fileName = giftRegistry[n];
            
            if(n === 5) {
                const video = document.createElement('video');
                video.className = 'media-content';
                video.src = 'assets/' + fileName;
                video.controls = true;
                video.autoplay = true;
                vault.appendChild(video);
                document.getElementById('final-tag').style.display = 'block';
            } else {
                const img = document.createElement('img');
                img.className = 'media-content';
                img.src = 'assets/' + fileName; 
                vault.appendChild(img);
            }
        }

        function changePage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
                    </html>
